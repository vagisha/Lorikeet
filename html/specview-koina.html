function clearFields() {

	$('input[name="sequence"]').val("");
	$("#peaks").val("");
}

function createSpectrum() {

	// first remove the existing spectrum
	$("#specview_plot_div").html("");
	$("#koina_results_table").html("");
	$("#koina_results_table_title").hide();
	
	// -----------------------------------------------------------
	// get the sequence
	// -----------------------------------------------------------
	let sequence = $('input[name="sequence"]').val();
	if(!sequence) {
		alert("Please enter a sequence");
		return false;
	}

	let precursorCharge = parseInt($('input[name="charge"]').val());
	let collisionEnergy = $("#ce_field").is(":visible") ? parseInt($('input[name="ce"]').val()) : null;
	let instrumentType = $("#instrumentType_field").is(":visible") ? document.getElementById("instrument_type").value : null;
	let fragmentationType = $("#fragmentationType_field").is(":visible") ? document.getElementById("fragmentation_type").value : null;

	const predictionModel = document.getElementById("prediction_model").value;
	console.log("Model: " + predictionModel, "; charge: " + precursorCharge + "; CE: " + collisionEnergy + "; Instrument type: " + instrumentType + "; Fragmentation type: " + fragmentationType);

	if (!predictionModel)
	{
		alert("Please select a prediction model");
		return false;
	}

	const modifiedSequence = getModifiedSequence(sequence);
	const inputSequence = modifiedSequence.length > 0 ? modifiedSequence : sequence; // This is the input to Koina
	const URL = "https://koina.wilhelmlab.org/v2/models/" + predictionModel + "/infer";
	console.log("Koina URL: " + URL + "; Sequence: " + inputSequence);

	const inputs = [];
	inputs.push({"name": "peptide_sequences", "shape": [1, 1], "datatype": "BYTES", "data": [inputSequence]});
	inputs.push({"name": "precursor_charges", "shape": [1, 1], "datatype": "INT32", "data": [precursorCharge]});
	if (collisionEnergy)
	{
		inputs.push({"name": "collision_energies", "shape": [1, 1], "datatype": "FP32", "data": [collisionEnergy]})
	}
	if (instrumentType)
	{
		inputs.push({"name": "instrument_types", "shape": [1, 1], "datatype": "BYTES", "data": [instrumentType]})
	}
	if (fragmentationType)
	{
		inputs.push({"name": "fragmentation_types", "shape": [1, 1], "datatype": "BYTES", "data": [fragmentationType]})
	}
	// console.log(inputs);
	// return;

	// Query Koina
	$.ajax({
		url: URL,
		type: "POST",
		contentType: "application/json", // Ensure server expects JSON
		// processData: false, // Prevent automatic serialization. Uncomment this if not using JSON.stringify()
		data: JSON.stringify(
        {
            "id": "0",
            "inputs": inputs
        }),
		success: function(response) {
			console.log("Response:", response);
			$("#page-mask").hide();
			$("#loading-indicator").hide();
			parseResponse(sequence, response["outputs"]);
		},
		error: function(xhr, status, error) {
			console.log("An error occurred. Error:" + error + "; Status: " + status);
			$("#loading-indicator").hide();
			$("#page-mask").hide();
			if (xhr.responseText) {
				try {
					const jsonResponse = JSON.parse(xhr.responseText);
					console.log("JSON Response:", jsonResponse);
				} catch (e) {
					console.error("Failed to parse JSON:", e);
					console.error("Raw Response Text:", xhr.responseText);
				}
			} else {
				console.warn("No responseText available. It might be a network error or server issue.");
			}
		}
	});
	
	return true;
}

function removeModifications(sequence)
{
	// Use a regular expression to remove modifications like [UNIMOD:XX]
	return sequence.replace(/\[UNIMOD:\d+\]/gi, '');
}

function parseResponse(sequence, output)
{
	console.log("Output: " + output);
	let mz, intensities, annotations;
	for (let i = 0; i < 3; i += 1)
	{
		const out_i = output[i];
		const name = out_i["name"];
		const data = out_i["data"];
		if ("mz" === name)
		{
			mz = data;
		}
		else if ("intensities" === name)
		{
			intensities = data
		}
		else if ("annotation" === name)
		{
			annotations = data
		}
	}
	if (!mz) { alert("Could not parse m/z values from response."); return; }
	if (!intensities) { alert("Could not parse intensity values from response."); return; }
	if (!annotations) { alert("Could not parse annotation values from response."); return; }

	console.log("Remove -1 entries, and sort by mz")
	// Combine the arrays
	const list = [];
	for (let j = 0; j < mz.length; j++)
	{
		if (mz[j] < 0) continue;
		list.push({'mz': mz[j], 'intensity': intensities[j], 'annotation': annotations[j]});
	}
    // Sort
	list.sort(function(a, b) {
		return ((a.mz < b.mz) ? -1 : ((a.mz == b.mz) ? 0 : 1));
	});

	console.log(list);
    // Get the peaks
	const peaks = [];
	const sortedAnnotations = [];
	let resultString = "";
	let resultTable = "<table ><tr><th>m/z</th><th>Intensity</th><th>Ion</th></tr><tbody>";
	for (let k = 0; k < list.length; k++)
	{
		const intensity_6 = roundTo(list[k].intensity, 6);
		const mz_4 = roundTo(list[k].mz, 4);

		resultString += mz_4 + ", " + intensity_6 + ", " + list[k].annotation + "</br>";
		if (intensity_6 > 0)
		{
			peaks.push([list[k].mz, list[k].intensity]);
			sortedAnnotations.push(list[k].annotation);
			resultTable += "<tr style='font-weight: bold;'><td>" + mz_4 + "</td><td>" + intensity_6 + "</td><td>" + list[k].annotation + "</td></tr>";
		}
		else
		{
			resultTable += "<tr><td>" + mz_4 + "</td><td>" + intensity_6 + "</td><td>" + list[k].annotation + "</td></tr>";
		}
	}
	console.log(peaks);
	console.log(sortedAnnotations);
	resultTable += "</tbody></table>"
	// $("#koina_output").html(resultString);
	$("#koina_results_table_title").show();
	$("#koina_results_table").html(resultTable);

	// We have all the data. Create the plot
	createLorikeetPlot(sequence, peaks, sortedAnnotations);
}

function createLorikeetPlot(sequence, peaks, sortedAnnotations)
{
	const sequenceNoMods = removeModifications(sequence);
	console.log("sequence without mods: " + sequenceNoMods);
	// Get the selected modifications in a format that can be passed to Lorikeet.

	const varMods = generateVariableModsForLorikeet(sequence);

	$("#specview_plot_div").specviewKoina({sequence: sequenceNoMods,
		scanNum: 1111,
		charge: 1,
		fileName:'no-file-name',
		//staticMods: staticMods,
		variableMods: varMods,
		//ntermMod: ntermMod,
		//ctermMod: ctermMod,
		peaks: peaks, annotations:sortedAnnotations});
}

function generateVariableModsForLorikeet(peptide)
{
	const variableMods = [];

	peptide.split('').forEach((aminoAcid, index) => {
		const combobox = document.getElementById(`combo-${index}`); // Get the combobox for this amino acid
		if (combobox && combobox.value) {
			// Get the selected option from the combobox
			const selectedOption = combobox.selectedOptions[0];

			// Parse the modification mass from the data attribute
			const modMass = parseFloat(selectedOption.dataset.mass);

			// Add the modification to the variableMods array
			variableMods.push({
				index: index + 1, // 1-based index
				modMass: modMass,
				aminoAcid: aminoAcid
			});
		}
	});

	return variableMods;
}

function roundTo(number, precision) {
	precision = precision === undefined ? 4 : precision;
	const factor = Math.pow(10, precision);
	number = Math.round(number * factor) / factor;
	return number.toFixed(precision); // Returns a string representing a number in fixed-point notation.
}

	$("#page-mask").hide();
});

function generateModificationsTable(sequence) {
	modificationsTable.innerHTML = ''; // Clear previous table
	sequence.split('').forEach((aminoAcid, index) => {
		const row = document.createElement('tr');

		// Create a cell for the amino acid
		const cellAminoAcid = document.createElement('td');
		cellAminoAcid.textContent = aminoAcid;
		row.appendChild(cellAminoAcid);

		// Create a cell for the combobox
		const cellCombobox = document.createElement('td');
		const ptms = ptmLookup[aminoAcid]?.map(ptmKey => ptmTable[ptmKey]);

		if (ptms && ptms.length > 0) {
			const combobox = document.createElement('select');
			combobox.id = `combo-${index}`;

			// Add a blank option as the first item
			const blankOption = document.createElement('option');
			blankOption.value = '';
			blankOption.textContent = '';
			combobox.appendChild(blankOption);

			// Add PTM options
			ptms.forEach(ptm => {
				const option = document.createElement('option');
				option.value = ptm.unimodId;
				option.textContent = `${ptm.name} (Mass: ${ptm.mass.toFixed(3)})`;
				option.dataset.unimodId = ptm.unimodId; // Store UNIMOD ID as a data attribute
				option.dataset.mass = ptm.mass; // Store mass as a data attribute
				combobox.appendChild(option);
			});

			cellCombobox.appendChild(combobox);
		} else {
			// Leave the cell empty if no modifications are available
			cellCombobox.textContent = '';
		}

		row.appendChild(cellCombobox);

		// Add the row to the table
		modificationsTable.appendChild(row);
	});

	restoreValues(sequence);
}

// Function to save combobox values
function saveValues(peptide) {
	peptide.split('').forEach((aminoAcid, index) => {
		const combobox = document.getElementById(`combo-${index}`);
		if (combobox) {
			localStorage.setItem(`combo-${index}`, combobox.value);
		}
	});
}

// Function to restore combobox values
function restoreValues(peptide) {
	peptide.split('').forEach((aminoAcid, index) => {
		const savedValue = localStorage.getItem(`combo-${index}`);
		const combobox = document.getElementById(`combo-${index}`);
		if (savedValue && combobox) {
			combobox.value = savedValue;
		}
	});
}

function getModifiedSequence(peptide, massdiff = false) {
	let modifiedPeptide = ''; // Initialize the modified peptide sequence

	peptide.split('').forEach((aminoAcid, index) => {
		const combobox = document.getElementById(`combo-${index}`); // Get the combobox for this amino acid
		if (combobox && combobox.value) {
			// Get the selected option and modification details
			const selectedOption = combobox.selectedOptions[0];
			const modMass = parseFloat(selectedOption.dataset.mass); // Parse the mass from the data attribute
			const unimodId = combobox.value; // Get the UNIMOD ID

			if (massdiff) {
				// Use the mass difference, rounded to no decimals
				const roundedMass = Math.round(modMass);
				const sign = roundedMass >= 0 ? '+' : ''; // Add '+' for positive values, no extra sign for negative values
				modifiedPeptide += `${aminoAcid}[${sign}${roundedMass}]`;
			} else {
				// Use the UNIMOD ID
				modifiedPeptide += `${aminoAcid}[UNIMOD:${unimodId}]`;
			}
		} else {
			// If no modification is selected, just append the amino acid
			modifiedPeptide += aminoAcid;
		}
	});

	// Return the modified sequence only if there are modifications
	return modifiedPeptide.length > peptide.length ? modifiedPeptide : '';
}

async function loadUnimodModifications(xmlFilePath) {
	try {
		// Fetch the XML file
		const response = await fetch(xmlFilePath);
		const xmlText = await response.text();

		// Parse the XML
		const parser = new DOMParser();
		const xmlDoc = parser.parseFromString(xmlText, "application/xml");

		// Process each <umod:mod> element
		const mods = xmlDoc.getElementsByTagName("umod:mod");
		for (let mod of mods) {
			const title = mod.getAttribute("title");
			const fullName = mod.getAttribute("full_name");
			const recordId = mod.getAttribute("record_id");
			const delta = mod.getElementsByTagName("umod:delta")[0];
			const monoMass = parseFloat(delta.getAttribute("mono_mass"));

			// Add to the ptmTable
			ptmTable[title.toLowerCase()] = {
				name: fullName,
				unimodId: recordId,
				mass: monoMass,
			};

			// Process each <umod:specificity> element
			const specificities = mod.getElementsByTagName("umod:specificity");
			for (let spec of specificities) {
				const site = spec.getAttribute("site");
				const hidden = spec.getAttribute("hidden");

				// Skip hidden modifications
				if (hidden === "1") continue;

				// Add to the ptmLookup
				if (!ptmLookup[site]) {
					ptmLookup[site] = [];
				}
				ptmLookup[site].push(title.toLowerCase());
			}
		}

		console.log("PTM Table:", ptmTable);
		console.log("PTM Lookup:", ptmLookup);
	} catch (error) {
		console.error("Error loading or parsing Unimod file:", error);
	}
}
